name: Naijashop dbt workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
    
  schedule:
    - cron: "0 7 * * *"

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    env:
      DBT_HOST: ${{ secrets.NEON_HOST }}
      DBT_USER: ${{ secrets.NEON_USER }}
      DBT_PASSWORD: ${{ secrets.NEON_PASSWORD }}
      DBT_DATABASE: ${{ secrets.NEON_DB }}
      DBT_SCHEMA: ${{ secrets.NEON_SCHEMA }}
      DBT_PORT: ${{ secrets.NEON_PORT }}
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Create profiles.yml
        run: |
          cat > profiles.yml <<EOF
          naijashop_dbt:
            target: prod
            outputs:
              prod:
                type: postgres
                host: ${{ env.DBT_HOST }}
                user: ${{ env.DBT_USER }}
                password: ${{ env.DBT_PASSWORD }}
                dbname: ${{ env.DBT_DATABASE }}
                schema: ${{ env.DBT_SCHEMA }}
                port: ${{ env.DBT_PORT }}
                threads: 4
                sslmode: require
          EOF

      - name: dbt debug
        working-directory: naijashop_dbt
        run: dbt debug

      - name: dbt deps
        working-directory: naijashop_dbt
        run: dbt deps || true

      - name: dbt seed, run, test
        working-directory: naijashop_dbt
        run: |
          dbt seed
          dbt run
          dbt test
  
